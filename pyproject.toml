# Runtime adapters stay on the standard library.
# Test tools and optional features are dependency groups; `dev` installs all of them.
# Everything resolves through uv.lock.

[project]
name = "ironmate"
version = "0.0.0"
description = "Document and image conversion checks"
requires-python = ">=3.11"

[dependency-groups]
# Feature groups for opt-in installs. `dev` includes all of them, so
# `uv run --locked` (CI) installs the same set as before.
test = [
    "pytest>=8",
    "pyyaml>=6",
]
codecs = [
    "numpy>=1.26",
    "pillow>=10",
]
preview = [
    "playwright>=1.63.0",
    "pypdf>=6",
]
dev = [
    { include-group = "test" },
    { include-group = "codecs" },
    { include-group = "preview" },
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--tb=short",
    "--durations=10",
    "--strict-markers",
    "--strict-config",
]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "heavy: resource-intensive or long-running tests excluded from the default fast suite",
    "network: tests that call GitHub or other live network services (opt-in only)",
]
