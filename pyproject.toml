# Runtime adapters stay on the standard library.
# Test tools and optional features are dependency groups; `dev` installs all of them.
# Everything resolves through uv.lock.

[project]
name = "ironmate"
version = "0.0.0"
description = "Document and image conversion checks"
requires-python = ">=3.11"

[dependency-groups]
# Feature groups for opt-in installs. `dev` includes all of them, so
# `uv run --locked` (CI) installs the same set as before.
test = [
    "pytest>=8",
    "pyyaml>=6",
    # The studio stylesheets are generated from PySaiyanWeBoo's web_ui (scripts/build_studio_css.py); the pin is a
    # commit. Move it with: uv lock --upgrade-package pysaiyanweboo
    "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@f624d9364017b7e2da7f797817dfba2a8d9adb14",
]
codecs = [
    "numpy>=1.26",
    "pillow>=10",
]
preview = [
    "playwright>=1.63.0",
    "pypdf>=6",
]
dev = [
    { include-group = "test" },
    { include-group = "codecs" },
    { include-group = "preview" },
]

[tool.uv]
package = false
