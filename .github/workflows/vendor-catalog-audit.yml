name: Audit parent vendor catalog enrollment

on:
  pull_request:
    paths:
      - vendor-catalog.json
      - vendor.lock.json
      - scripts/vendor_enrollment_audit.py
      - .github/workflows/vendor-catalog-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: a9df23dec720f125772a24b77b413552d60060ba
          path: .vendor-audit-tools
          persist-credentials: false
          sparse-checkout: |
            vendor_sync.py
            vendor_catalog.py
            vendor_consumers.py
            vendor-consumers.json
          sparse-checkout-cone-mode: false
      - name: Audit all recommended source and license identities
        env:
          PYTHONPATH: .vendor-audit-tools
        run: python -S scripts/vendor_enrollment_audit.py
      - name: Project retired CI-only tools out of pinned parent topology
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          path = Path(".vendor-audit-tools/vendor-consumers.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          for consumer in data["consumers"]:
              if consumer["repository"] != "myon-bioinformatics/Ironmate":
                  continue
              consumer["entries"] = [
                  entry for entry in consumer["entries"]
                  if not (
                      entry["repository"] == "myon-bioinformatics/myon-bioinformatics"
                      and entry["source"] in {"git_inspector.py", "vendor_sync.py"}
                  )
              ]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Compare parent consumer topology against committed Ironmate lock
        run: |
          python -S .vendor-audit-tools/vendor_consumers.py compare --consumer myon-bioinformatics/Ironmate --lock vendor.lock.json --registry .vendor-audit-tools/vendor-consumers.json
      - name: Verify proposed candidates in a separate root
        run: |
          python -S - <<'PY'
          import json
          import shutil
          from pathlib import Path
          root = Path("build/vendor-enrollment-audit/candidate")
          root.mkdir(parents=True, exist_ok=True)
          shutil.copyfile("build/vendor-enrollment-audit/proposed-vendor.lock.json", root / "vendor.lock.json")
          for item in json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))["files"]:
              dest = root / item["destination"]
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(item["destination"], dest)
          PY
          python -S .vendor-audit-tools/vendor_sync.py enroll --root build/vendor-enrollment-audit/candidate --manifest vendor.lock.json
          python -S .vendor-audit-tools/vendor_sync.py check --root build/vendor-enrollment-audit/candidate --manifest vendor.lock.json
          git diff --exit-code -- vendor.lock.json vendor/
      - name: Publish audit and proposed lock for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-catalog-enrollment-audit
          path: build/vendor-enrollment-audit/
          if-no-files-found: warn
          retention-days: 14
