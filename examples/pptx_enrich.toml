# Existing four-slide deck; choose free regions. Agenda is deferred.
[[patterns]]
pattern = "cards"
slide = 1
x = 0.5
y = 1.2
width = 9.0
height = 4.0
columns = 3
[[patterns.items]]
title = "Observation"
body = "Record the current state."
[[patterns.items]]
title = "Comparison"
body = "Use consistent conditions."
[[patterns.items]]
title = "Decision"
body = "Describe the evidence."

[[patterns]]
pattern = "regions"
slide = 2
x = 0.5
y = 1.2
width = 9.0
height = 4.0
accent = "#000000"
[[patterns.items]]
title = "Input"
body = "Collect data."
[[patterns.items]]
title = "Process"
body = "Transform data."
[[patterns.items]]
title = "Output"
body = "Present results."

[[patterns]]
pattern = "flow"
slide = 3
x = 0.5
y = 1.2
width = 9.0
height = 3.0
gap = 0.4
[[patterns.items]]
title = "Receive"
body = "Validate input."
[[patterns.items]]
title = "Transform"
body = "Apply explicit rules."
[[patterns.items]]
title = "Check"
body = "Verify the output."
[[patterns.items]]
title = "Publish"
body = "Save a new file."

[[patterns]]
pattern = "table"
slide = 4
x = 0.5
y = 1.2
width = 9.0
height = 3.0
csv = "comparison.csv"
