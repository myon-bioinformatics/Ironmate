<!doctype html><meta charset="utf-8"><title>Ironmate MCP Stub</title><style>body{background:#080d13;color:#c9ffb6;font:16px ui-monospace,monospace;max-width:800px;margin:3rem auto;padding:1rem}button,input,pre{background:#0d1720;color:#c9ffb6;border:1px solid #48a8ff;padding:.6rem}pre{white-space:pre-wrap}</style><h1>&gt; Ironmate MCP stub</h1><p>Public JSON → trace-shaped response. No secrets or server required.</p><input id=q placeholder="filter, e.g. flutter"><button id=b>Run</button><pre id=o>Ready.</pre><script>const u="https://myon-bioinformatics.github.io/api/repos.json";b.onclick=async()=>{let request_id=crypto.randomUUID();o.textContent="Loading…";try{let p=await fetch(u);if(!p.ok)throw Error("HTTP "+p.status);let d=await p.json(),a=Array.isArray(d)?d:d.repositories||[],q=document.querySelector("#q").value.toLowerCase();if(q)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));o.textContent=JSON.stringify({request_id,run_id:crypto.randomUUID(),call_id:crypto.randomUUID(),status:"completed",source_url:u,retrieved_at:new Date().toISOString(),items:a.slice(0,5),missing_data:[]},null,2)}catch(e){o.textContent=JSON.stringify({request_id,status:"failed",source_url:u,missing_data:["repository fixture could not be retrieved"],error:String(e)},null,2)}};</script>
