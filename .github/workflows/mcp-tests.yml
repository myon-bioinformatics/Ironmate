name: Python tests and vendor verification

on:
  pull_request:
    paths:
      - "*.py"
      - "vendor.lock.json"
      - "vendor/**"
      - "scripts/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/mcp-tests.yml"
  push:
    branches: [main]
    paths:
      - "*.py"
      - "vendor.lock.json"
      - "vendor/**"
      - "scripts/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/mcp-tests.yml"

  workflow_dispatch:
    inputs:
      vendor-mode:
        description: Public vendor placement mode for this CI run
        type: choice
        options: [update, locked]
        default: update

permissions:
  contents: read

jobs:
  resolve-vendor:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 974da5eb9593df652b132e4b0f1a679f67422566
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Save checked-in vendor identities
        run: cp vendor.lock.json .vendor-baseline.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
              Path(entry['destination']).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Update public vendor files for this run
        id: vendor-update
        shell: bash
        if: inputs.vendor-mode != 'locked'
        run: |
          python -S .vendor-sync-tools/vendor_sync.py promote --manifest vendor.lock.json | tee vendor-promotion.json
          python -S -m json.tool vendor-promotion.json > /dev/null
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Refresh legacy provenance from the verified lock
        run: python -S scripts/sync_vendor_provenance.py
      - name: Summarize snapshot and checked-in baseline
        if: always()
        shell: bash
        env:
          VENDOR_UPDATE_OUTCOME: ${{ steps.vendor-update.outcome }}
        run: >-
          python -S scripts/sync_vendor_provenance.py
          --summary-baseline .vendor-baseline.lock.json
          --summary-output "$GITHUB_STEP_SUMMARY"
          --update-outcome "$VENDOR_UPDATE_OUTCOME"
      - name: Stage canonical vendor evidence
        if: always()
        env:
          VENDOR_EVIDENCE_KIND: ${{ inputs.vendor-mode == 'locked' && 'locked' || 'candidate' }}
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --kind "$VENDOR_EVIDENCE_KIND" --output build/vendor-evidence-candidate
          --legacy-evidence vendor/ascii_artist.provenance.json
          --legacy-evidence vendor/git_inspector.provenance.json
          --legacy-evidence vendor/markdown.provenance.json
          --promotion-receipt vendor-promotion.json
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: build/vendor-evidence-candidate
          if-no-files-found: error
          retention-days: 14

  test:
    permissions:
      contents: read
    needs: resolve-vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 974da5eb9593df652b132e4b0f1a679f67422566
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        shell: bash
        run: |
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S scripts/sync_vendor_provenance.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r tests/requirements.txt
      - name: Check out pinned test-only JUnit importer
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/xprobe
          ref: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          path: build/shared
          persist-credentials: false
          sparse-checkout: xprobe.py
          sparse-checkout-cone-mode: false
      - name: Compile all tracked Python sources before test collection
        id: compile
        run: |
          git ls-files '*.py' -z | xargs -0 python -m py_compile
      - run: python -m unittest tests/test_vendor_modules.py tests/test_repository_hygiene.py
      - name: Run default pytest suite (exclude heavy tests)
        # Still gather pytest evidence after a unittest failure; that job stays red.
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          IRONMATE_FAILURE_EVIDENCE: build/controlled-failure
        run: python -m pytest -q -m "not heavy" --junitxml=build/test-results/pytest-3.12.xml
      - name: Preserve raw suite JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py3.12
          path: build/test-results/pytest-3.12.xml
          if-no-files-found: error
          retention-days: 14
      - name: Preserve controlled child evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-controlled-py3.12
          path: build/controlled-failure/
          if-no-files-found: error
          retention-days: 14


      - name: Stage canonical vendor evidence
        if: always()
        env:
          VENDOR_EVIDENCE_KIND: ${{ inputs.vendor-mode == 'locked' && 'locked' || 'candidate' }}
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --kind "$VENDOR_EVIDENCE_KIND" --output build/vendor-evidence-test
          --legacy-evidence vendor/ascii_artist.provenance.json
          --legacy-evidence vendor/git_inspector.provenance.json
          --legacy-evidence vendor/markdown.provenance.json
          --promotion-receipt vendor-promotion.json
      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-py3.12
          path: build/vendor-evidence-test
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [test, marp-integration]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      expected-reports: '["junit-py3.12/pytest-3.12.xml","junit-controlled-py3.12/junit.xml","junit-marp/marp.xml"]'
      artifact-pattern: "junit-*"
      output-artifact: "failure-identity"

  test-locked:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@v7
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        ref: 974da5eb9593df652b132e4b0f1a679f67422566
        path: .vendor-sync-tools
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S - <<'PY'
        import json
        from pathlib import Path
        for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
            Path(entry['destination']).unlink()
        PY
        python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
        python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Refresh legacy provenance from the verified lock
      run: python -S scripts/sync_vendor_provenance.py
    - run: python -m pip install --upgrade pip
    - run: python -m pip install -r tests/requirements.txt
    - name: Check out pinned test-only JUnit importer
      uses: actions/checkout@v7
      with:
        repository: myon-bioinformatics/xprobe
        ref: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
        path: build/shared
        persist-credentials: false
        sparse-checkout: xprobe.py
        sparse-checkout-cone-mode: false
    - name: Compile all tracked Python sources before test collection
      run: |
        git ls-files '*.py' -z | xargs -0 python -m py_compile
    - run: python -m unittest tests/test_vendor_modules.py tests/test_repository_hygiene.py
    - name: Run default pytest suite (exclude heavy tests)
      run: python -m pytest -q -m "not heavy"
    - name: Stage canonical vendor evidence
      if: always()
      run: >-
        python -S .vendor-sync-tools/vendor_stage.py
        --kind locked --output build/vendor-evidence-locked
        --legacy-evidence vendor/ascii_artist.provenance.json
        --legacy-evidence vendor/git_inspector.provenance.json
        --legacy-evidence vendor/markdown.provenance.json
    - name: Preserve vendor lock used by this run
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-vendor-lock-py3.12
        path: build/vendor-evidence-locked
        if-no-files-found: error
        retention-days: 14
    name: Locked baseline
    timeout-minutes: 20

  marp-integration:
    name: Marp real PPTX conversion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PPTX reader and pinned Marp CLI
        run: |
          python -m pip install "python-pptx>=1.0,<2" "pytest>=8,<10"
          npm install --no-save --ignore-scripts @marp-team/marp-cli@4.2.3
      - name: Locate browser
        shell: bash
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Run real Markdown to Marp to PPTX integration
        env:
          IRONMATE_RUN_MARP_INTEGRATION: "1"
          IRONMATE_MARP_BIN: node_modules/.bin/marp
        run: python -m pytest -q tests/test_marp_pptx.py --junitxml=build/test-results/marp.xml
      - name: Preserve Marp JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-marp
          path: "build/test-results/marp*"
          if-no-files-found: warn
          retention-days: 14
