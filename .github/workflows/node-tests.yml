name: Node tests

on:
  pull_request:
    paths:
      - "*.cjs"
      - "vendor/py_launch.cjs"
      - "tests/**/*.cjs"
      - "tests/test_studio.py"
      - "ironlib/studio_bundle.py"
      - "studio/*.cjs"
      - "tests/fixtures/py_launch/**"
      - "package.json"
      - "flow_workspace.py"
      - "studio_ingress.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/node-tests.yml"
  push:
    branches: [main]
    paths:
      - "*.cjs"
      - "vendor/py_launch.cjs"
      - "tests/**/*.cjs"
      - "tests/test_studio.py"
      - "ironlib/studio_bundle.py"
      - "studio/*.cjs"
      - "tests/fixtures/py_launch/**"
      - "package.json"
      - "flow_workspace.py"
      - "studio_ingress.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/node-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["26", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Node unit tests
        run: >-
          node --test
          tests/py_launch.test.cjs
          tests/studio_ingress.test.cjs
      - name: Run workspace history contracts
        run: >-
          uv run --locked --only-group stdlib-test
          python -m pytest -q tests/test_studio.py -k workspace_history_contract_in_node
