# Runtime adapters stay on the standard library.
# Test tools are the dev group and resolve through uv.lock.

[project]
name = "ironmate"
version = "0.0.0"
description = "Document and image conversion checks"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "numpy>=1.26",
    "pillow>=10",
    "playwright>=1.63.0",
    "pypdf>=6",
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false
