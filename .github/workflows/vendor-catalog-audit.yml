name: Audit parent vendor catalog enrollment

on:
  pull_request:
    paths:
      - vendor-catalog.json
      - vendor.lock.json
      - scripts/vendor_enrollment_audit.py
      - .github/workflows/vendor-catalog-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve parent main for shared catalog audit tools
        id: parent-vendor-tools
        env:
          PARENT_REPOSITORY: myon-bioinformatics/myon-bioinformatics
          PARENT_REPOSITORY_ID: "638801160"
        run: |
          set -euo pipefail
          python -S <<'PY'
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          PARENT = os.environ["PARENT_REPOSITORY"]
          expected_id = int(os.environ["PARENT_REPOSITORY_ID"])
          remote = "https://github.com/" + PARENT + ".git"
          repo_id_re = re.compile(
              r'<meta name="octolytics-dimension-repository_id" content="(\d+)"'
          )
          nwo_re = re.compile(
              r'<meta name="octolytics-dimension-repository_nwo" content="([^"]+)"'
          )
          git_env = {k: v for k, v in os.environ.items() if not k.startswith("GIT_")}
          git_env.update(
              GIT_TERMINAL_PROMPT="0",
              GIT_CONFIG_NOSYSTEM="1",
              GIT_CONFIG_GLOBAL=os.devnull,
          )
          git = [
              "git",
              "-c",
              "credential.helper=",
              "-c",
              "core.askPass=",
              "-c",
              "http.extraHeader=",
          ]

          symref = subprocess.run(
              git + ["ls-remote", "--symref", remote, "HEAD"],
              env=git_env,
              capture_output=True,
              timeout=120,
              check=True,
          ).stdout.decode("utf-8", "replace")
          branch = None
          sha = None
          for line in symref.splitlines():
              if line.startswith("ref: refs/heads/"):
                  branch = line.split("refs/heads/", 1)[1].split("\t", 1)[0]
              elif re.fullmatch(r"[0-9a-f]{40}\tHEAD", line):
                  sha = line.split("\t", 1)[0]
          if not branch or not sha:
              raise SystemExit("could not resolve parent default branch from ls-remote")

          html = urllib.request.urlopen(
              "https://github.com/" + PARENT,
              timeout=60,
          ).read().decode("utf-8", "replace")
          id_match = repo_id_re.search(html)
          if not id_match:
              raise SystemExit("missing repository id in public page metadata")
          repo_id = int(id_match.group(1))
          if repo_id != expected_id:
              raise SystemExit(
                  "repository_id mismatch: expected {} got {}".format(expected_id, repo_id)
              )
          nwo_match = nwo_re.search(html)
          if nwo_match and nwo_match.group(1).casefold() != PARENT.casefold():
              raise SystemExit("repository name mismatch on public page")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as handle:
              handle.write("sha={}\n".format(sha))
              handle.write("branch={}\n".format(branch))
              handle.write("repository_id={}\n".format(repo_id))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Resolved parent vendor tools\n\n")
                  handle.write("- Repository: `{}` (id `{}`)\n".format(PARENT, repo_id))
                  handle.write("- Default branch: `{}`\n".format(branch))
                  handle.write("- Commit: `{}`\n".format(sha))
          PY
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: ${{ steps.parent-vendor-tools.outputs.sha }}
          path: .vendor-audit-tools
          persist-credentials: false
          sparse-checkout: |
            vendor_sync.py
            vendor_catalog.py
            vendor_consumers.py
            vendor-consumers.json
          sparse-checkout-cone-mode: false
      - name: Audit all recommended source and license identities
        env:
          PYTHONPATH: .vendor-audit-tools
        run: python -S scripts/vendor_enrollment_audit.py
      - name: Project retired CI-only tools out of pinned parent topology
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          path = Path(".vendor-audit-tools/vendor-consumers.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          for consumer in data["consumers"]:
              if consumer["repository"] != "myon-bioinformatics/Ironmate":
                  continue
              consumer["entries"] = [
                  entry for entry in consumer["entries"]
                  if not (
                      entry["repository"] == "myon-bioinformatics/myon-bioinformatics"
                      and entry["source"] in {"git_inspector.py", "vendor_sync.py"}
                  )
              ]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Compare parent consumer topology against committed Ironmate lock
        run: |
          python -S .vendor-audit-tools/vendor_consumers.py compare --consumer myon-bioinformatics/Ironmate --lock vendor.lock.json --registry .vendor-audit-tools/vendor-consumers.json
      - name: Verify proposed candidates in a separate root
        run: |
          python -S - <<'PY'
          import json
          import shutil
          from pathlib import Path
          root = Path("build/vendor-enrollment-audit/candidate")
          root.mkdir(parents=True, exist_ok=True)
          shutil.copyfile("build/vendor-enrollment-audit/proposed-vendor.lock.json", root / "vendor.lock.json")
          for item in json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))["files"]:
              dest = root / item["destination"]
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(item["destination"], dest)
          PY
          python -S .vendor-audit-tools/vendor_sync.py enroll --root build/vendor-enrollment-audit/candidate --manifest vendor.lock.json
          python -S .vendor-audit-tools/vendor_sync.py check --root build/vendor-enrollment-audit/candidate --manifest vendor.lock.json
          git diff --exit-code -- vendor.lock.json vendor/
      - name: Publish audit and proposed lock for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-catalog-enrollment-audit
          path: build/vendor-enrollment-audit/
          if-no-files-found: warn
          retention-days: 14
