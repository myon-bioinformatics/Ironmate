name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "github_catalog.py"
      - "repository_metadata.py"
      - "ironmate_mcp.py"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # GitHub Actions cron is UTC: minute 17 of every UTC hour.
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static repository metadata catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_catalog.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
