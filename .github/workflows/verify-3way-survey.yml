name: LittleBit-Jev 3-Way and 5-Way Survey Verification

on:
  pull_request:
    paths:
      - "research/littlebit_jev_3way_survey.py"
      - "tests/test_three_way_survey.py"
      - "research/littlebit_jev_5way_survey.py"
      - "tests/test_five_way_survey.py"
      - ".github/workflows/verify-3way-survey.yml"
  push:
    branches: [main]
    paths:
      - "research/littlebit_jev_3way_survey.py"
      - "tests/test_three_way_survey.py"
      - "research/littlebit_jev_5way_survey.py"
      - "tests/test_five_way_survey.py"
      - ".github/workflows/verify-3way-survey.yml"
  schedule:
    - cron: "0 23 * * *" # 08:00 JST, default branch only

permissions:
  contents: read

jobs:
  verify-survey-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      # Regression tests/JUnit remain in the existing Python test workflow.
      - name: Run paired held-out CPU benchmark
        run: python -S research/littlebit_jev_3way_survey.py --trials 40 --train-trials 4 --large-raster
      - name: Run topology, phase-ring and Boolean probe experiments
        run: python -S research/littlebit_jev_5way_survey.py --trials 25
      - name: Write readable summary
        run: |
          cat build/three-way-survey/report.md >> "$GITHUB_STEP_SUMMARY"
          cat build/five-way-survey/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw measurements and colored comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: three-way-survey
          path: |
            build/three-way-survey/
            build/five-way-survey/
          if-no-files-found: error
          retention-days: 14
