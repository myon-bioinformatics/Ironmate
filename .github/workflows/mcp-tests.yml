name: Test MCP stub

on:
  pull_request:
    paths:
      - "ironmate_mcp.py"
      - "github_catalog.py"
      - "github_adapter.py"
      - "source_adapter.py"
      - "niconico_adapter.py"
      - "repository_metadata.py"
      - "repository_metadata_contract.py"
      - "repository_metadata_generator.py"
      - "provenance.py"
      - "vendor/nvd_nist_known_vulns.py"
      - "docs/mcp-stub.html"
      - "vendor/markdown.py"
      - "vendor/ascii_artist.py"
      - "scripts/build_web_ui_consumer_examples.py"
      - "scripts/build_repository_diagnostics.py"
      - "scripts/unreviewed.py"
      - "tests/**"
      - "requirements-mcp.txt"
      - "pytest.ini"
      - ".github/workflows/mcp-tests.yml"
  push:
    branches: [main]
    paths:
      - "ironmate_mcp.py"
      - "github_catalog.py"
      - "github_adapter.py"
      - "source_adapter.py"
      - "niconico_adapter.py"
      - "repository_metadata.py"
      - "repository_metadata_contract.py"
      - "repository_metadata_generator.py"
      - "provenance.py"
      - "vendor/nvd_nist_known_vulns.py"
      - "docs/mcp-stub.html"
      - "vendor/markdown.py"
      - "vendor/ascii_artist.py"
      - "scripts/build_web_ui_consumer_examples.py"
      - "scripts/build_repository_diagnostics.py"
      - "scripts/unreviewed.py"
      - "tests/**"
      - "requirements-mcp.txt"
      - "pytest.ini"
      - ".github/workflows/mcp-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-mcp.txt pytest
      - name: Compile all tracked Python sources before test collection
        run: |
          git ls-files '*.py' -z | xargs -0 python -m py_compile
      - run: python -m unittest tests/test_ironmate_mcp.py tests/test_github_adapter.py tests/test_niconico_adapter.py tests/test_github_catalog.py tests/test_repository_metadata.py tests/test_nvd_nist_known_vulns.py tests/test_mcp_stub_page.py tests/test_vendor_modules.py tests/test_unreviewed.py tests/test_repository_hygiene.py
      - name: Run default pytest suite (exclude heavy tests)
        run: python -m pytest -q -m "not heavy"


  screenshot:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: "1.63.0"
      PLAYWRIGHT_BROWSER: "chromium"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out pinned browser-test-kit validators
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/browser-test-kit
          ref: 6a2e32a4bbe49be5268e6b30040d665a89eecf66
          path: .browser-test-kit
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Clear prior capture evidence
        run: rm -rf screenshot-evidence ironmate-mcp-stub-desktop-1440x900.png ironmate-mcp-stub-mobile-390x844.png ironmate-consumer-v1-index-desktop-1440x900.png ironmate-consumer-v1-markdown-mobile-390x844.png ironmate-consumer-v1-ascii-mobile-390x844.png ironmate-repository-diagnostics-desktop-1440x900.png
      - name: Install Chromium
        run: npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps "${PLAYWRIGHT_BROWSER}"

      - name: Build web-ui consumer examples
        run: python3 scripts/build_web_ui_consumer_examples.py
      - name: Build repository diagnostics fixture
        run: python3 scripts/build_repository_diagnostics.py

      - name: Serve repository
        run: python3 -m http.server 8000 > /tmp/ironmate-http.log 2>&1 &

      - name: Wait for MCP Stub
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/docs/mcp-stub.html"
          for attempt in range(50):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  if attempt == 49:
                      raise
                  time.sleep(0.1)
          PY

      - name: Capture desktop screenshot
        run: |
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" screenshot \
            --browser="${PLAYWRIGHT_BROWSER}" \
            --viewport-size="1440,900" \
            http://127.0.0.1:8000/docs/mcp-stub.html \
            ironmate-mcp-stub-desktop-1440x900.png

      - name: Capture mobile screenshot
        run: |
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" screenshot \
            --browser="${PLAYWRIGHT_BROWSER}" \
            --viewport-size="390,844" \
            http://127.0.0.1:8000/docs/mcp-stub.html \
            ironmate-mcp-stub-mobile-390x844.png

      - name: Capture consumer integration screenshots
        run: |
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" screenshot \
            --browser="${PLAYWRIGHT_BROWSER}" \
            --viewport-size="1440,900" \
            http://127.0.0.1:8000/docs/consumer-v1/index.html \
            ironmate-consumer-v1-index-desktop-1440x900.png
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" screenshot \
            --browser="${PLAYWRIGHT_BROWSER}" \
            --viewport-size="390,844" \
            http://127.0.0.1:8000/docs/consumer-v1/markdown.html \
            ironmate-consumer-v1-markdown-mobile-390x844.png
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" screenshot \
            --browser="${PLAYWRIGHT_BROWSER}" \
            --viewport-size="390,844" \
            http://127.0.0.1:8000/docs/consumer-v1/ascii.html \
            ironmate-consumer-v1-ascii-mobile-390x844.png
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" screenshot \
            --browser="${PLAYWRIGHT_BROWSER}" \
            --viewport-size="1440,900" \
            http://127.0.0.1:8000/docs/repository-diagnostics.html \
            ironmate-repository-diagnostics-desktop-1440x900.png

      - name: Seal current-run capture receipt
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CAPTURE_STAGE: ${{ job.status == 'success' && 'complete' || 'failed' }}
        run: |
          mkdir -p screenshot-evidence
          if [ -f ironmate-mcp-stub-desktop-1440x900.png ]; then cp ironmate-mcp-stub-desktop-1440x900.png screenshot-evidence/; fi
          if [ -f ironmate-mcp-stub-mobile-390x844.png ]; then cp ironmate-mcp-stub-mobile-390x844.png screenshot-evidence/; fi
          if [ -f ironmate-consumer-v1-index-desktop-1440x900.png ]; then cp ironmate-consumer-v1-index-desktop-1440x900.png screenshot-evidence/; fi
          if [ -f ironmate-consumer-v1-markdown-mobile-390x844.png ]; then cp ironmate-consumer-v1-markdown-mobile-390x844.png screenshot-evidence/; fi
          if [ -f ironmate-consumer-v1-ascii-mobile-390x844.png ]; then cp ironmate-consumer-v1-ascii-mobile-390x844.png screenshot-evidence/; fi
          if [ -f ironmate-repository-diagnostics-desktop-1440x900.png ]; then cp ironmate-repository-diagnostics-desktop-1440x900.png screenshot-evidence/; fi
          python3 -S .browser-test-kit/scripts/write_capture_evidence.py screenshot-evidence --project chromium --captures ironmate-mcp-stub-desktop-1440x900.png,ironmate-mcp-stub-mobile-390x844.png,ironmate-consumer-v1-index-desktop-1440x900.png,ironmate-consumer-v1-markdown-mobile-390x844.png,ironmate-consumer-v1-ascii-mobile-390x844.png,ironmate-repository-diagnostics-desktop-1440x900.png --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --stage "$CAPTURE_STAGE"
      - name: Require all captures, hashes and current run identity
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -S .browser-test-kit/scripts/check_capture_evidence.py screenshot-evidence --expect chromium --captures ironmate-mcp-stub-desktop-1440x900.png,ironmate-mcp-stub-mobile-390x844.png,ironmate-consumer-v1-index-desktop-1440x900.png,ironmate-consumer-v1-markdown-mobile-390x844.png,ironmate-consumer-v1-ascii-mobile-390x844.png,ironmate-repository-diagnostics-desktop-1440x900.png --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Prove rejection using copies of actual evidence
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -S .browser-test-kit/scripts/probe_capture_rejections.py screenshot-evidence --expect chromium --captures ironmate-mcp-stub-desktop-1440x900.png,ironmate-mcp-stub-mobile-390x844.png,ironmate-consumer-v1-index-desktop-1440x900.png,ironmate-consumer-v1-markdown-mobile-390x844.png,ironmate-consumer-v1-ascii-mobile-390x844.png,ironmate-repository-diagnostics-desktop-1440x900.png --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve complete or failed receipts and images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-receipts
          path: screenshot-evidence
          retention-days: 14

      - name: Show HTTP server log on failure
        if: failure()
        run: tail -n 20 /tmp/ironmate-http.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ironmate-mcp-stub-screenshots
          path: ironmate-mcp-stub-*.png
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ironmate-web-ui-consumer-screenshots
          path: ironmate-consumer-v1-*.png
          retention-days: 14

      - name: Upload repository diagnostics screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ironmate-repository-diagnostics-screenshots
          path: ironmate-repository-diagnostics-*.png
          retention-days: 14
