name: Pages

# 🧭 The tools (Image Studio, browser tools, Slide Studio) are published by the portfolio under /tools/ironmate/
# (scripts/project_pages.py --record-tools runs image_studio.py --build-site). Here `build` keeps testing them in a
# real browser, and `guide` publishes docs/guide.page.json with the parent's reusable workflow.

on:
  push:
    branches: [main]
    paths:
      [
        "docs/guide.page.json",
        "docs/evidence/browser.gif",
        "docs/assets/phone-slides.gif",
        "studio/**",
        "ironlib/studio_bundle.py",
        "image_studio.py",
        "pixel_grid.py",
        "ironlib/grid_output.py",
        "scripts/pages_catalog.py",
        "scripts/build_slide_shell.py",
        "Dockerfile.pages",
        "tests/pages_browser.cjs",
        "tests/test_pages_tools.py",
        "tests/slides_browser.cjs",
        "tests/test_browser_slides.py",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    paths:
      [
        "docs/guide.page.json",
        "docs/evidence/browser.gif",
        "docs/assets/phone-slides.gif",
        "studio/**",
        "ironlib/studio_bundle.py",
        "image_studio.py",
        "pixel_grid.py",
        "ironlib/grid_output.py",
        "scripts/pages_catalog.py",
        "scripts/build_slide_shell.py",
        "Dockerfile.pages",
        "tests/pages_browser.cjs",
        "tests/test_pages_tools.py",
        "tests/slides_browser.cjs",
        "tests/test_browser_slides.py",
        ".github/workflows/pages.yml",
      ]

permissions:
  contents: read

concurrency:
  group: studio-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check the dependency-free client and build only public assets
        run: |
          python3 -S -c "import ironlib.studio_bundle as b, subprocess; subprocess.run(['node', '--check', '-'], input=b.STUDIO_JS, text=True, check=True)"
          docker build --target artifact --output type=local,dest=build/studio-site -f Dockerfile.pages .
      - name: Start the same static site in Docker
        run: |
          docker build --target runtime -t ironmate-pages:test -f Dockerfile.pages .
          docker run --detach --rm --name ironmate-pages --publish 127.0.0.1:8080:8080 ironmate-pages:test
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/Ironmate/tools/ --output /tmp/tools.html
      - name: Verify browser operations and Python grid round-trip
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          IRONMATE_PAGES_URL=http://127.0.0.1:8080/Ironmate/ node tests/pages_browser.cjs
          IRONMATE_PAGES_URL=http://127.0.0.1:8080/Ironmate/ node tests/slides_browser.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-browser-evidence
          path: build/pages-evidence
          if-no-files-found: warn
      - name: Stop the preview container
        if: always()
        # http.server as PID 1 ignores SIGTERM, so the default 10 s grace period was all wait (15 s step).
        run: docker stop --time 1 ironmate-pages || true
  guide:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@1368174821fb03be258ecf3312ce0ea809f6ea22
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_assets: >-
        studio/brand/icon-192.png=icon.png
        studio/brand/favicon-48.png=favicon.png
        docs/evidence/browser.gif=demos/browser.gif
        docs/assets/phone-slides.gif=demos/phone-slides.gif
