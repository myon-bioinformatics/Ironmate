name: Image Studio Pages

on:
  push:
    branches: [main]
    paths: ["studio/**", "image_studio.py", ".github/workflows/studio-pages.yml"]
  pull_request:
    paths: ["studio/**", "image_studio.py", ".github/workflows/studio-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check the dependency-free client and build only public assets
        run: |
          node --check studio/core.js
          node --check studio/studio.js
          python -S image_studio.py --build-site build/studio-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/studio-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Verify the published editor is available
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 6 --retry-delay 3 --retry-all-errors "$SITE_URL" --output /tmp/studio-index.html
          python -S - <<'PY'
          from pathlib import Path
          text = Path('/tmp/studio-index.html').read_text()
          assert 'Base64 / 渡す' in text and 'core.js' in text
          print('Published Image Studio HTML verified')
          PY
