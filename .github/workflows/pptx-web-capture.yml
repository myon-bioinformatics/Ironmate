name: PPTX web capture fixture

on:
  pull_request:
    paths:
      - pptx_web_capture.py
      - tests/test_pptx_web_capture.py
      - tests/requirements-web.txt
      - .github/workflows/pptx-web-capture.yml
  push:
    branches: [main]
    paths:
      - pptx_web_capture.py
      - tests/test_pptx_web_capture.py
      - tests/requirements-web.txt
      - .github/workflows/pptx-web-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out reviewed evidence tools
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/browser-test-kit
          ref: d172b7cb57c0a78bf793b5d3e2f031b14b1db9dc
          path: build/browser-test-kit
          persist-credentials: false
          sparse-checkout: |
            scripts/check_png.py
            scripts/check_capture_evidence.py
            scripts/write_capture_evidence.py
          sparse-checkout-cone-mode: false
      - name: Install optional browser test dependencies
        run: python -m pip install -r tests/requirements-web.txt
      - name: Install matching Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test real Chromium against local synthetic viewer
        env:
          IRONMATE_RUN_WEB_CAPTURE: "1"
          IRONMATE_BTK_ROOT: build/browser-test-kit
          IRONMATE_WEB_EVIDENCE: build/pptx-web-capture
          IRONMATE_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q tests/test_pptx_web_capture.py --junitxml=build/pptx-web-capture-junit.xml
      - name: Preserve synthetic capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-local-viewer-evidence
          path: |
            build/pptx-web-capture/
            build/pptx-web-capture-junit.xml
          if-no-files-found: error
          retention-days: 14
