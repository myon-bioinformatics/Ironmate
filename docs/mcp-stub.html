<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ironmate MCP Stub Explorer</title>
<style>body{margin:auto;max-width:900px;padding:20px;background:#080d13;color:#c9ffb6;font:16px ui-monospace,monospace}button,input,pre{background:#0d1720;color:#c9ffb6;border:1px solid #48a8ff;padding:.6rem}button{cursor:pointer}.panel{border:1px solid #48a8ff;padding:14px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid #48a8ff;background:#091218;padding:10px;text-align:left}.tag{border:1px solid #c9ffb6;padding:1px 5px;margin:3px;display:inline-block;font-size:.8rem}.hint{color:#a4afbc}pre{white-space:pre-wrap;overflow:auto}</style>
<h1>&gt; MCP Stub Explorer</h1><p class=hint>Search, inspect, export evidence, and rerun a prior request.</p>
<section class=panel><input id=query placeholder="filter, e.g. flutter"><button id=run>Run</button><button id=clear>Clear history</button><p id=summary class=hint>Filter: — · matched: —</p></section>
<section class=panel><h2>Repository details</h2><div id=results class=grid></div></section><section class=panel><h2>Technology stack</h2><div id=stats class=grid></div></section><section class=panel><h2>Evidence export</h2><button id=copy-json>Copy JSON</button><button id=download-json>Download JSON</button><button id=download-md>Download Markdown</button><pre id=trace>Run a query to create a trace.</pre></section><section class=panel><h2>Recent runs</h2><div id=history class=grid></div></section>
<script>
const sourceUrl="https://myon-bioinformatics.github.io/api/repos.json",fields=["name","description","language","topics","readmeSummary"],historyKey="ironmate.mcp-stub.history.v1",maxHistory=12,timeoutMs=10000;let current,activeRunId=null;const $=id=>document.getElementById(id),publicItem=x=>Object.fromEntries(fields.map(f=>[f,x[f]??null])),text=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),markdownText=x=>String(x??"").split("").map(c=>(c===String.fromCharCode(92)||"`*_{}[]<>#+!|".includes(c)?String.fromCharCode(92)+c:c)).join("");
function stacks(items,key){const c={};items.forEach(x=>(Array.isArray(x[key])?x[key]:[x[key]]).filter(Boolean).forEach(y=>c[y]=(c[y]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12)}
function renderStats(items){$("stats").innerHTML=[["Languages",stacks(items,"language")],["Topics",stacks(items,"topics")]].map(([t,r])=>`<article class=card><b>${t}</b><p>${r.map(([v,n])=>`<span class=tag>${text(v)} × ${n}</span>`).join("")||"No data"}</p></article>`).join("")}
function renderResults(items){$("results").innerHTML=items.map(x=>`<article class=card><b>${text(x.name)}</b><p class=hint>${text(x.language||"Unknown")}</p><p>${text(x.description||x.readmeSummary||"No summary.")}</p><p>${(x.topics||[]).map(t=>`<span class=tag>#${text(t)}</span>`).join("")}</p><a href="https://github.com/myon-bioinformatics/${encodeURIComponent(x.name)}" target=_blank rel=noopener>Open GitHub ↗</a></article>`).join("")||"<p>No matching repositories.</p>"}
function readHistory(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch{return[]}}function renderHistory(){$("history").innerHTML=readHistory().map(x=>`<button class="card rerun" data-query="${encodeURIComponent(x.query)}"><b>${text(x.query||"(all)")}</b><br><span class=hint>${x.matched_count} of ${x.available_count}</span></button>`).join("")||"<p>No saved runs.</p>";document.querySelectorAll(".rerun").forEach(b=>b.onclick=()=>run(decodeURIComponent(b.dataset.query)))}function saveHistory(r){try{const next=[{query:r.filter.query,matched_count:r.matched_count,available_count:r.available_count,retrieved_at:r.retrieved_at},...readHistory().filter(x=>x.query!==r.filter.query)].slice(0,maxHistory);localStorage.setItem(historyKey,JSON.stringify(next));renderHistory()}catch{}}
function base(query){return{request_id:crypto.randomUUID(),run_id:crypto.randomUUID(),call_id:crypto.randomUUID(),filter:{query,fields},source_url:sourceUrl,retrieved_at:new Date().toISOString()}}
function setRunControls(disabled){$("run").disabled=disabled;document.querySelectorAll(".rerun").forEach(button=>button.disabled=disabled)}async function run(forced){if(activeRunId)return;const query=(forced??$("query").value).trim().toLowerCase(),b=base(query),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);activeRunId=b.run_id;setRunControls(true);$("query").value=query;$("summary").textContent="Loading…";try{const response=await fetch(sourceUrl,{signal:controller.signal});if(!response.ok)throw Error();const payload=await response.json();let a=Array.isArray(payload)?payload:payload.repos;if(!Array.isArray(a)){const e=Error();e.code="source_payload_invalid";throw e}a=a.filter(x=>x&&typeof x==="object");const available_count=a.length,matches=query?a.filter(x=>JSON.stringify(publicItem(x)).toLowerCase().includes(query)):a,items=matches.slice(0,20).map(publicItem);current={...b,status:"completed",matched_count:matches.length,available_count,items,missing_data:[]};$("summary").textContent=`Filter: ${query||"(all)"} · matched: ${matches.length} of ${available_count}`;renderResults(items);renderStats(items);saveHistory(current)}catch(e){current={...b,status:"failed",matched_count:null,available_count:null,items:[],missing_data:["repository fixture could not be retrieved"],error:e.name==="AbortError"?"source_timeout":e.code||"source_fetch_failed"};$("summary").textContent=`Filter: ${query||"(all)"} · request failed`;$("results").innerHTML="";$("stats").innerHTML=""}finally{clearTimeout(timer);$("trace").textContent=JSON.stringify(current,null,2);activeRunId=null;setRunControls(false)}}
function download(n,t,c){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function markdown(){const r=current;return `# Ironmate repository search\n\n- Status: ${markdownText(r.status)}\n- Query: ${markdownText(r.filter.query||"(all)")}\n- Matched: ${r.matched_count??"N/A"} of ${r.available_count??"N/A"}\n- Retrieved: ${markdownText(r.retrieved_at)}\n- Source: ${markdownText(r.source_url)}\n\n${r.items.map(x=>`## ${markdownText(x.name)}\n${markdownText(x.description||x.readmeSummary||"No summary")}`).join("\n\n")}`}$("run").onclick=()=>run();$("clear").onclick=()=>{try{localStorage.removeItem(historyKey)}catch{}renderHistory()};$("copy-json").onclick=()=>current&&navigator.clipboard.writeText(JSON.stringify(current,null,2));$("download-json").onclick=()=>current&&download("ironmate-run.json","application/json",JSON.stringify(current,null,2));$("download-md").onclick=()=>current&&download("ironmate-report.md","text/markdown",markdown());renderHistory();
</script>
