name: LittleBit-Jev 3-Way and 5-Way Survey Verification

on:
  pull_request:
    paths:
      - "scripts/littlebit_jev_3way_survey.py"
      - "tests/test_three_way_survey.py"
      - "scripts/littlebit_jev_5way_survey.py"
      - "tests/test_five_way_survey.py"
      - ".github/workflows/verify_3way_survey.yml"
  push:
    branches: [main]
    paths:
      - "scripts/littlebit_jev_3way_survey.py"
      - "tests/test_three_way_survey.py"
      - "scripts/littlebit_jev_5way_survey.py"
      - "tests/test_five_way_survey.py"
      - ".github/workflows/verify_3way_survey.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 08:00 JST, default branch only

permissions:
  contents: read

jobs:
  verify-survey-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Regression tests/JUnit remain in the existing Python test workflow.
      - name: Run paired held-out CPU benchmark
        run: python -S scripts/littlebit_jev_3way_survey.py --trials 40 --train-trials 4 --large-raster
      - name: Run topology and phase-ring experiment
        run: python -S scripts/littlebit_jev_5way_survey.py --trials 25
      - name: Write readable summary
        run: |
          cat build/three-way-survey/report.md >> "$GITHUB_STEP_SUMMARY"
          cat build/five-way-survey/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw measurements and colored comparisons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: three-way-survey
          path: |
            build/three-way-survey/
            build/five-way-survey/
          if-no-files-found: error
          retention-days: 14
