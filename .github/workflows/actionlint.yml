name: Validate GitHub Actions

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  # Shared actionlint uses a SHA-256 verified official binary without Docker.
  actionlint:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@f907560c2b9b3f7a0f78f4434f547f91cb2ef954
