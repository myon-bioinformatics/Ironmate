name: Audit parent vendor catalog enrollment

on:
  pull_request:
    paths:
      - vendor-catalog.json
      - vendor.lock.json
      - scripts/vendor_enrollment_audit.py
      - .github/workflows/vendor-catalog-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 14ef53c8316015d1350e62ff9cce3301103e65a7
          path: .vendor-audit-tools
          persist-credentials: false
          sparse-checkout: |
            vendor_sync.py
            vendor_catalog.py
            vendor_consumers.py
            vendor-consumers.json
          sparse-checkout-cone-mode: false
      - name: Audit all recommended source and license identities
        env:
          PYTHONPATH: .vendor-audit-tools
        run: python -S scripts/vendor_enrollment_audit.py
      - name: Enroll proposed vendor files in disposable CI checkout
        env:
          PYTHONPATH: .vendor-audit-tools
        run: |
          cp build/vendor-enrollment-audit/proposed-vendor.lock.json vendor.lock.json
          python -S .vendor-audit-tools/vendor_sync.py enroll --manifest vendor.lock.json
          python -S .vendor-audit-tools/vendor_sync.py check --manifest vendor.lock.json
          mkdir -p build/vendor-enrollment-audit/verified
          cp vendor.lock.json build/vendor-enrollment-audit/verified/vendor.lock.json
          python -S - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))
          for item in lock["files"]:
              source = Path(item["destination"])
              dest = Path("build/vendor-enrollment-audit/verified") / source
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(source.read_bytes())
          PY
      - name: Compare parent consumer topology against committed Ironmate lock
        run: |
          python -S .vendor-audit-tools/vendor_consumers.py compare --consumer myon-bioinformatics/Ironmate --lock vendor.lock.json --registry .vendor-audit-tools/vendor-consumers.json
      - name: Publish audit and proposed lock for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-catalog-enrollment-audit
          path: build/vendor-enrollment-audit/
          if-no-files-found: warn
          retention-days: 14
