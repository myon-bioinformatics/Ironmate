name: HTML PDF preview review

on:
  pull_request:
    paths:
      - pptx_pipeline.py
      - pptx_preview.py
      - tests/test_pptx_pipeline.py
      - tests/test_pptx_preview.py
      - tests/requirements-preview.txt
      - pyproject.toml
      - uv.lock
      - pptx_mapping.py
      - pptx_spec.py
      - pptx_ooxml.py
      - pptx_render.py
      - pptx/**
      - package.json
      - package-lock.json
      - scripts/pptxgen_render.mjs
      - scripts/pptxgen_allowlist.json
      - .github/workflows/pptx-review.yml
  push:
    branches: [main]
    paths:
      - pptx_pipeline.py
      - pptx_preview.py
      - tests/test_pptx_pipeline.py
      - tests/test_pptx_preview.py
      - tests/requirements-preview.txt
      - pyproject.toml
      - uv.lock
      - pptx_mapping.py
      - pptx_spec.py
      - pptx_ooxml.py
      - pptx_render.py
      - pptx/**
      - package.json
      - package-lock.json
      - scripts/pptxgen_render.mjs
      - scripts/pptxgen_allowlist.json
      - .github/workflows/pptx-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.15"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install pinned pptxgenjs
        run: npm ci
      - name: Install pinned Marp CLI
        run: npm install --prefix build/preview-tools --no-save --ignore-scripts @marp-team/marp-cli@4.5.1
      - name: Install matching Chromium
        run: uv run --locked python -m playwright install --with-deps --only-shell chromium
      - name: Test actual Marp HTML PDF PNG and final PPTX inspection
        env:
          IRONMATE_RUN_REVIEW: "1"
          IRONMATE_MARP_BIN: build/preview-tools/node_modules/.bin/marp
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          IRONMATE_REVIEW_EVIDENCE: build/pptx-review
          IRONMATE_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --locked python -m pytest -q tests/test_pptx_preview.py tests/test_pptx_pipeline.py --junitxml=build/pptx-review-junit.xml
      - name: Preserve synthetic preview PDF and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-marp-preview-evidence
          path: |
            build/pptx-review/
            build/pptx-review-junit.xml
          if-no-files-found: error
          retention-days: 14
