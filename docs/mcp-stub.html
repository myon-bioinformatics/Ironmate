<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ironmate MCP Stub Explorer</title>
<!-- web-ui contract pinned to 77ae752599a59e50b6595233f6162a38ebc572b7 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/myon-bioinformatics/web-ui@77ae752599a59e50b6595233f6162a38ebc572b7/css/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/myon-bioinformatics/web-ui@77ae752599a59e50b6595233f6162a38ebc572b7/css/base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/myon-bioinformatics/web-ui@77ae752599a59e50b6595233f6162a38ebc572b7/css/components.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/myon-bioinformatics/web-ui@77ae752599a59e50b6595233f6162a38ebc572b7/css/stub.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/myon-bioinformatics/web-ui@77ae752599a59e50b6595233f6162a38ebc572b7/css/themes/modern.css">
</head>
<body data-ui-theme="modern">
<main class="ui-page">
<h1 class="ui-title">MCP Stub Explorer</h1>
<p class="ui-muted">Search, inspect, export evidence, and rerun a prior request.</p>

<section class="ui-panel">
  <div class="stub-toolbar">
    <input class="ui-input" id="query" placeholder="filter, e.g. flutter">
    <button class="ui-button" id="run" type="button">Run</button>
    <button class="ui-button" id="clear" type="button">Clear history</button>
  </div>
  <p id="summary" class="ui-muted stub-status">Filter: — · matched: —</p>
</section>

<section class="ui-panel">
  <h2>Repository details</h2>
  <div id="results" class="ui-grid"></div>
</section>

<section class="ui-panel">
  <h2>Technology stack</h2>
  <div id="stats" class="ui-grid"></div>
</section>

<section class="ui-panel">
  <h2>Evidence export</h2>
  <div class="stub-toolbar">
    <button class="ui-button" id="copy-json" type="button">Copy JSON</button>
    <button class="ui-button" id="download-json" type="button">Download JSON</button>
    <button class="ui-button" id="download-md" type="button">Download Markdown</button>
  </div>
  <pre class="ui-output" id="trace">Run a query to create a trace.</pre>
</section>

<section class="ui-panel">
  <h2>Recent runs</h2>
  <div id="history" class="ui-grid"></div>
</section>
</main>
<script>
const sourceUrl="https://raw.githubusercontent.com/myon-bioinformatics/myon-bioinformatics.github.io/main/api/repos.json",fields=["name","description","language","topics","readmeSummary"],historyKey="ironmate.mcp-stub.history.v1",maxHistory=12,timeoutMs=10000;let current,activeRunId=null;const $=id=>document.getElementById(id),publicItem=x=>Object.fromEntries(fields.map(f=>[f,x[f]??null])),text=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),markdownText=x=>String(x??"").split("").map(c=>(c===String.fromCharCode(92)||"`*_{}[]<>#+!|".includes(c)?String.fromCharCode(92)+c:c)).join("");
function stacks(items,key){const c={};items.forEach(x=>(Array.isArray(x[key])?x[key]:[x[key]]).filter(Boolean).forEach(y=>c[y]=(c[y]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12)}
function renderStats(items){$("stats").innerHTML=[["Languages",stacks(items,"language")],["Topics",stacks(items,"topics")]].map(([t,r])=>`<article class=ui-card><b>${t}</b><p>${r.map(([v,n])=>`<span class=ui-tag>${text(v)} × ${n}</span>`).join("")||"No data"}</p></article>`).join("")}
function renderResults(items){$("results").innerHTML=items.map(x=>`<article class=ui-card><b>${text(x.name)}</b><p class=ui-muted>${text(x.language||"Unknown")}</p><p>${text(x.description||x.readmeSummary||"No summary.")}</p><p>${(x.topics||[]).map(t=>`<span class=ui-tag>#${text(t)}</span>`).join("")}</p><a href="https://github.com/myon-bioinformatics/${encodeURIComponent(x.name)}" target=_blank rel=noopener>Open GitHub ↗</a></article>`).join("")||"<p>No matching repositories.</p>"}
function readHistory(){try{return JSON.parse(localStorage.getItem(historyKey))||[]}catch{return[]}}function renderHistory(){$("history").innerHTML=readHistory().map(x=>`<button class="ui-card rerun" data-query="${encodeURIComponent(x.query)}"><b>${text(x.query||"(all)")}</b><br><span class=ui-muted>${x.matched_count} of ${x.available_count}</span></button>`).join("")||"<p>No saved runs.</p>";document.querySelectorAll(".rerun").forEach(b=>b.onclick=()=>run(decodeURIComponent(b.dataset.query)))}function saveHistory(r){try{const next=[{query:r.filter.query,matched_count:r.matched_count,available_count:r.available_count,retrieved_at:r.retrieved_at},...readHistory().filter(x=>x.query!==r.filter.query)].slice(0,maxHistory);localStorage.setItem(historyKey,JSON.stringify(next));renderHistory()}catch{}}
function base(query){return{request_id:crypto.randomUUID(),run_id:crypto.randomUUID(),call_id:crypto.randomUUID(),filter:{query,fields},source_url:sourceUrl,retrieved_at:new Date().toISOString()}}
function setRunControls(disabled){$("run").disabled=disabled;document.querySelectorAll(".rerun").forEach(button=>button.disabled=disabled)}async function run(forced){if(activeRunId)return;const query=(forced??$("query").value).trim().toLowerCase(),b=base(query),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);activeRunId=b.run_id;setRunControls(true);$("query").value=query;$("summary").textContent="Loading…";try{const response=await fetch(`${sourceUrl}?t=${Date.now()}`,{signal:controller.signal,cache:"no-store"});if(!response.ok)throw Error();const payload=await response.json();let a=Array.isArray(payload)?payload:payload.repos;if(!Array.isArray(a)){const e=Error();e.code="source_payload_invalid";throw e}a=a.filter(x=>x&&typeof x==="object");const available_count=a.length,matches=query?a.filter(x=>JSON.stringify(publicItem(x)).toLowerCase().includes(query)):a,items=matches.slice(0,20).map(publicItem);current={...b,status:"completed",matched_count:matches.length,available_count,items,missing_data:[]};$("summary").textContent=`Filter: ${query||"(all)"} · matched: ${matches.length} of ${available_count}`;renderResults(items);renderStats(items);saveHistory(current)}catch(e){current={...b,status:"failed",matched_count:null,available_count:null,items:[],missing_data:["repository fixture could not be retrieved"],error:e.name==="AbortError"?"source_timeout":e.code||"source_fetch_failed"};$("summary").textContent=`Filter: ${query||"(all)"} · request failed`;$("results").innerHTML="";$("stats").innerHTML=""}finally{clearTimeout(timer);$("trace").textContent=JSON.stringify(current,null,2);activeRunId=null;setRunControls(false)}}
function download(n,t,c){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function markdown(){const r=current;return `# Ironmate repository search\n\n- Status: ${markdownText(r.status)}\n- Query: ${markdownText(r.filter.query||"(all)")}\n- Matched: ${r.matched_count??"N/A"} of ${r.available_count??"N/A"}\n- Retrieved: ${markdownText(r.retrieved_at)}\n- Source: ${markdownText(r.source_url)}\n\n${r.items.map(x=>`## ${markdownText(x.name)}\n${markdownText(x.description||x.readmeSummary||"No summary")}`).join("\n\n")}`}$("run").onclick=()=>run();$("clear").onclick=()=>{try{localStorage.removeItem(historyKey)}catch{}renderHistory()};$("copy-json").onclick=()=>current&&navigator.clipboard.writeText(JSON.stringify(current,null,2));$("download-json").onclick=()=>current&&download("ironmate-run.json","application/json",JSON.stringify(current,null,2));$("download-md").onclick=()=>current&&download("ironmate-report.md","text/markdown",markdown());renderHistory();
</script>

</body>
</html>
